apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpc.fullname" . }}-config
  labels:
    {{- include "gpc.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- if .Values.serviceAccount.workloadIdentity.enabled }}
  AZURE_CLIENT_ID: {{ .Values.serviceAccount.workloadIdentity.clientId | quote }}
  {{- end }}

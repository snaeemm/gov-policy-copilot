{{- if .Values.secrets.externalSecret.enabled }}
# Alternative to the CSI driver: External Secrets Operator syncing from Azure Key Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "gpc.fullname" . }}
  labels:
    {{- include "gpc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "gpc.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.externalSecret.objects }}
    - secretKey: {{ .env }}
      remoteRef:
        key: {{ .keyVaultSecret }}
    {{- end }}
{{- end }}

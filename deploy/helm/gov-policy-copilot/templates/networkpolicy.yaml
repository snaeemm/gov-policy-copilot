{{- if .Values.networkPolicy.enabled }}
# Default-deny for the app pods: ingress only from the ingress controller (plus explicit extras),
# egress only to DNS and HTTPS (Azure OpenAI, AI Search, Content Safety, Language, Entra ID, Key Vault).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gpc.fullname" . }}
  labels:
    {{- include "gpc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gpc.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressFromNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressFromPodLabels | nindent 14 }}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
{{- end }}

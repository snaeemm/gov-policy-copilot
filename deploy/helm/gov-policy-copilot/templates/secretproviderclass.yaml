{{- if .Values.secrets.csi.enabled }}
# Azure Key Vault provider for the Secrets Store CSI driver (AKS add-on: azure-keyvault-secrets-provider).
# Secrets are mounted and synced into a Kubernetes Secret only for env-var consumption.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "gpc.fullname" . }}-kv
  labels:
    {{- include "gpc.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "gpc.secretName" . }}
      type: Opaque
      data:
        {{- range .Values.secrets.csi.objects }}
        - objectName: {{ .keyVaultSecret }}
          key: {{ .env }}
        {{- end }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "secrets.csi.keyVaultName is required" .Values.secrets.csi.keyVaultName | quote }}
    tenantId: {{ required "secrets.csi.tenantId is required" .Values.secrets.csi.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secrets.csi.objects }}
        - |
          objectName: {{ .keyVaultSecret }}
          objectType: secret
        {{- end }}
{{- end }}

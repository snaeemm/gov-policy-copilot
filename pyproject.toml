[project]
name = "gov-policy-copilot"
version = "0.1.0"
description = "Bilingual (AR/EN) RAG assistant over public UAE government policy documents - Azure reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "openai>=1.50",
  "azure-identity>=1.17",
  "azure-search-documents>=11.6.0b4",
  "azure-ai-documentintelligence>=1.0.0",
  "azure-ai-contentsafety>=1.0.0",
  "azure-ai-textanalytics>=5.3.0",
  "azure-keyvault-secrets>=4.8",
  "azure-monitor-opentelemetry>=1.6",
  "semantic-kernel>=1.10",
  "pyjwt[crypto]>=2.9",
  "slowapi>=0.1.9",
  "sse-starlette>=2.1",
  "tiktoken>=0.7",
  "pypdf>=7.1.1",
  "pillow>=13.0.0",
  "pypdfium2>=5.15.2",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
eval = ["azure-ai-evaluation>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # Arabic text is intentional
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
"src/gov_copilot/agent/schemas.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

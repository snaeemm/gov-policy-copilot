[project]
name = "gov-policy-copilot"
version = "0.1.0"
description = "Bilingual (AR/EN) RAG assistant over public UAE government policy documents - Azure reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "openai>=1.50",
  "azure-identity>=1.17",
  "azure-search-documents>=11.6.0b4",
  "azure-ai-documentintelligence>=1.0.0",
  "azure-ai-contentsafety>=1.0.0",
  "azure-ai-textanalytics>=5.3.0",
  "azure-keyvault-secrets>=4.8",
  "azure-monitor-opentelemetry>=1.6",
  "semantic-kernel>=1.10",
  "pyjwt[crypto]>=2.9",
  "slowapi>=0.1.9",
  "sse-starlette>=2.1",
  "tiktoken>=0.7",
  "pypdf>=7.1.1",
  "pillow>=13.0.0",
  "pypdfium2>=5.15.2",
  # Query classifier runtime (ONNX, no torch in the serving image)
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "huggingface-hub>=0.25",
  "numpy>=1.26",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
eval = ["azure-ai-evaluation>=1.0"]
# Training the query classifier (CPU). Not installed in the serving image.
ml = [
  "torch>=2.4",
  "transformers>=4.45",
  "datasets>=3.0",
  "scikit-learn>=1.5",
  "mlflow>=2.16",
  "azureml-mlflow>=1.57",
  "azure-ai-ml>=1.20",
  "matplotlib>=3.9",
  "onnx>=1.16",
  "accelerate>=0.34",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "respx>=0.21"]

# CPU-only torch wheels on Linux (GitHub runners): avoids multi-GB CUDA downloads.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # Arabic text is intentional
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
"src/gov_copilot/agent/schemas.py" = ["E501"]
"ml/**" = ["S311", "S603", "S607", "E501"]  # offline training scripts: seeded RNG, az/git CLI
"scripts/fabric_publish.py" = ["E501"]
"scripts/build_classifier_dataset.py" = ["S311", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
